services:
  nestjs-api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - 3000:3000
    volumes:
      - .:/home/node/app
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      redis:
        condition: service_healthy

  db:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=streamtube
      - POSTGRES_PASSWORD=streamtube
      - POSTGRES_DB=streamtube
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamtube"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    # minio/minio and minio/mc were pulled from Docker Hub (access denied as of this
    # implementation) and quay.io/minio/* now returns 401 even for anonymous `latest`
    # pulls — both registries effectively gate the community images. bitnamilegacy
    # mirrors the same upstream MinIO server/client unchanged; MINIO_ROOT_USER/
    # MINIO_ROOT_PASSWORD and the API/console ports are identical to upstream.
    image: bitnamilegacy/minio:latest
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY_ID}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_ACCESS_KEY}
      - MINIO_BROWSER=on
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-bootstrap:
    # Only creates the bucket. A lifecycle rule for AbortIncompleteMultipartUpload was
    # attempted here (per phase-03-videos/TD-03's cited mitigation) but MinIO's server
    # rejects that lifecycle action outright — confirmed via both `mc ilm rule import`
    # and a direct `aws s3api put-bucket-lifecycle-configuration` call against the S3
    # API itself (not a client-tooling gap): https://github.com/minio/minio/issues/16120.
    # The abandoned-upload cleanup this bucket would have provided is instead covered
    # at the application level by SI-03.11's reaper.
    image: bitnamilegacy/minio-client:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID} ${S3_SECRET_ACCESS_KEY} &&
        mc mb --ignore-existing local/${S3_BUCKET}

  video-worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/home/node/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  minio-data:

